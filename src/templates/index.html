<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookRec</title>
  <style>
    :root { --bg:#111; --fg:#eee; --muted:#999; --accent:#d98c3f; --card:#1a1a1a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:2rem 1rem; }
    h1 { margin:0 0 .2rem; }
    .stats { color:var(--muted); margin-bottom:1.5rem; font-size:.9rem; }
    .card { width:min(520px,100%); background:var(--card); border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.5); }
    .cover-wrap { background:#222; min-height:260px; display:flex; align-items:center; justify-content:center; position:relative; }
    .cover { max-height:260px; object-fit:contain; }
    .no-cover { color:var(--muted); font-size:4rem; }
    .info { padding:1.2rem; }
    .title { font-size:1.4rem; font-weight:700; margin:0 0 .3rem; }
    .authors { color:var(--muted); margin-bottom:.8rem; }
    .reason { border-left:3px solid var(--accent); padding-left:.8rem; margin-bottom:1rem; color:#ddd; }
    .desc { color:#bbb; font-size:.95rem; line-height:1.45; max-height:120px; overflow:auto; }
    .actions { display:flex; gap:.5rem; padding:1rem 1.2rem 1.2rem; }
    button { flex:1; border:none; border-radius:10px; padding:.8rem; font-size:1rem; cursor:pointer; transition:.15s; }
    .like { background:var(--accent); color:#111; font-weight:700; }
    .like:hover { filter:brightness(1.1); }
    .skip { background:#333; color:var(--fg); }
    .skip:hover { background:#444; }
    .dislike { background:#222; color:#ff6b6b; }
    .dislike:hover { background:#2a1a1a; }
    .more { background:#1f3a20; color:#90ee90; }
    .more:hover { background:#26482a; }
    .loading { text-align:center; padding:2rem; color:var(--muted); }
    .empty { text-align:center; padding:3rem; color:var(--muted); }
  </style>
</head>
<body>
  <h1>BookRec</h1>
  <div class="stats" id="stats">Loading…</div>
  <div id="app"><div class="loading">Loading recommendations…</div></div>
  <script>
    let currentBook = null;
    async function load() {
      const r = await fetch('/api/recommend');
      const data = await r.json();
      const app = document.getElementById('app');
      if (data.done) {
        currentBook = null;
        app.innerHTML = '<div class="empty">No more recommendations right now.<br><button onclick="location.reload()">Refresh</button></div>';
        return;
      }
      currentBook = data.book;
      const b = data.book;
      const cover = b.cover_url ? `<img class="cover" src="${b.cover_url}" alt="cover">` : '<div class="no-cover">📖</div>';
      app.innerHTML = `
        <div class="card">
          <div class="cover-wrap">${cover}</div>
          <div class="info">
            <div class="title">${escapeHtml(b.title)}</div>
            <div class="authors">${escapeHtml(b.authors.join(', ') || 'Unknown author')}</div>
            <div class="reason">${escapeHtml(b.reason)}</div>
            <div class="desc">${escapeHtml(b.description || '')}</div>
          </div>
          <div class="actions">
            <button class="dislike" onclick="send('dislike')">👎</button>
            <button class="skip" onclick="send('skip')">Skip</button>
            <button class="more" onclick="send('more')">More like this</button>
            <button class="like" onclick="send('like')">👍</button>
          </div>
        </div>`;
    }
    async function send(action) {
      if (!currentBook) return load();
      const book = currentBook;
      currentBook = null;
      document.getElementById('app').innerHTML = '<div class="loading">Thinking…</div>';
      await fetch('/api/feedback', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({book_id: book.id, action, reason_shown: book.reason}) });
      await load();
      loadStats();
    }
    async function loadStats() {
      const r = await fetch('/api/stats');
      const s = await r.json();
      document.getElementById('stats').textContent = `${s.total} books · ${s.liked} liked · ${s.disliked} disliked · ${s.seen} seen`;
    }
    function escapeHtml(t) { return (t||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    load();
    loadStats();
  </script>
</body>
</html>
