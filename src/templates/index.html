<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookRec</title>
  <style>
    :root { --bg:#111; --fg:#eee; --muted:#999; --accent:#d98c3f; --card:#1a1a1a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); min-height:100vh; padding:2rem 1rem; }
    .wrap { max-width:1100px; margin:0 auto; }
    h1 { margin:0 0 .2rem; }
    .stats { color:var(--muted); margin-bottom:1rem; font-size:.9rem; }
    .tabs { display:flex; gap:.3rem; margin-bottom:0; flex-wrap:wrap; }
    .tab { background:#1a1a1a; color:var(--muted); border:none; border-radius:8px 8px 0 0; padding:.6rem 1.2rem; cursor:pointer; font-size:.9rem; transition:.15s; border-bottom:3px solid transparent; }
    .tab:hover { color:var(--fg); }
    .tab.active { color:var(--fg); border-bottom-color:var(--accent); background:var(--card); }
    .tab .count { font-size:.75rem; color:var(--muted); margin-left:.3rem; }
    .toolbar { display:flex; gap:.5rem; align-items:center; margin-bottom:1rem; padding-top:1rem; }
    .toolbar button { background:#333; color:var(--fg); border:none; border-radius:8px; padding:.5rem 1rem; cursor:pointer; }
    .toolbar button:hover { background:#444; }
    .toolbar .danger { background:#3a1f1f; color:#ff9b9b; }
    .toolbar .danger:hover { background:#4a2626; }
    .loading { text-align:center; padding:3rem; color:var(--muted); }
    .empty { text-align:center; padding:3rem; color:var(--muted); }
    table { width:100%; border-collapse:collapse; background:var(--card); border-radius:0 12px 12px 12px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.5); }
    th, td { padding:.8rem 1rem; text-align:left; vertical-align:top; border-bottom:1px solid #2a2a2a; }
    th { color:var(--muted); font-weight:600; font-size:.85rem; text-transform:uppercase; letter-spacing:.03em; background:#161616; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#1e1e1e; }
    .cover-cell { width:56px; }
    .cover { width:44px; height:60px; object-fit:cover; border-radius:4px; background:#222; }
    .no-cover { width:44px; height:60px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:1.4rem; background:#222; border-radius:4px; }
    .title { font-weight:700; }
    .authors { color:var(--muted); font-size:.85rem; }
    .reason { color:#ddd; font-size:.9rem; }
    .desc { color:#bbb; font-size:.85rem; line-height:1.4; max-height:60px; overflow:hidden; }
    .actions { white-space:nowrap; }
    .actions button { border:none; border-radius:8px; padding:.4rem .6rem; margin-right:.3rem; cursor:pointer; font-size:.9rem; transition:.15s; }
    .like { background:var(--accent); color:#111; font-weight:700; }
    .like:hover { filter:brightness(1.1); }
    .skip { background:#333; color:var(--fg); }
    .skip:hover { background:#444; }
    .dislike { background:#222; color:#ff6b6b; }
    .dislike:hover { background:#2a1a1a; }
    .more { background:#1f3a20; color:#90ee90; }
    .more:hover { background:#26482a; }
    .toread { background:#1f2a3a; color:#8ec5ff; }
    .toread:hover { background:#26364a; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>BookRec</h1>
    <div class="stats" id="stats">Loading…</div>
    <div class="tabs" id="tabs"></div>
    <div class="toolbar" id="toolbar"></div>
    <div id="app"><div class="loading">Loading…</div></div>
  </div>
  <script>
    let currentBooks = [];
    let currentTab = 'recommend';
    let statsData = { total:0, liked:0, disliked:0, seen:0, toread:0 };

    const TAB_DEFS = [
      { id:'recommend', label:'Recommendations', icon:'📚' },
      { id:'liked', label:'Liked', icon:'👍', action:'like' },
      { id:'more', label:'More Like This', icon:'🔍' },
      { id:'toread', label:'To Read', icon:'📖', action:'toread' },
      { id:'skip', label:'Skipped', icon:'⏭️', action:'skip' },
      { id:'disliked', label:'Disliked', icon:'👎', action:'dislike' },
    ];

    function renderTabs() {
      const el = document.getElementById('tabs');
      el.innerHTML = TAB_DEFS.map(t => {
        const count = t.action ? (t.action === 'like' ? statsData.liked : t.action === 'dislike' ? statsData.disliked : t.action === 'toread' ? statsData.toread : t.action === 'skip' ? statsData.seen : 0) : '';
        const countHtml = count !== '' ? `<span class="count">(${count})</span>` : '';
        return `<button class="tab ${t.id === currentTab ? 'active' : ''}" onclick="switchTab('${t.id}')">${t.icon} ${t.label}${countHtml}</button>`;
      }).join('');
    }

    function renderToolbar() {
      const el = document.getElementById('toolbar');
      if (currentTab === 'recommend') {
        el.innerHTML = `<button onclick="loadRecommendations()">🔄 New batch</button><button class="danger" onclick="resetSeen()">↺ Reset seen</button>`;
      } else if (currentTab === 'more') {
        el.innerHTML = `<span style="color:var(--muted)">Click "More" on any recommendation to see similar books here.</span>`;
      } else {
        el.innerHTML = '';
      }
    }

    async function switchTab(tab) {
      currentTab = tab;
      renderTabs();
      renderToolbar();
      const app = document.getElementById('app');
      app.innerHTML = '<div class="loading">Loading…</div>';
      currentBooks = [];
      if (tab === 'recommend') {
        await loadRecommendations();
      } else if (tab === 'more') {
        app.innerHTML = '<div class="empty">Click "More" on a book in Recommendations to see similar books here.</div>';
      } else {
        await loadList(tab);
      }
    }

    async function loadRecommendations() {
      const app = document.getElementById('app');
      app.innerHTML = '<div class="loading">Loading recommendations…</div>';
      const r = await fetch('/api/recommendations?count=10');
      const data = await r.json();
      if (data.done || !data.books || data.books.length === 0) {
        app.innerHTML = '<div class="empty">No more recommendations right now.<br><button onclick="location.reload()">Refresh</button></div>';
        return;
      }
      currentBooks = data.books;
      renderTable(data.books, true);
    }

    async function loadList(tab) {
      const action = TAB_DEFS.find(t => t.id === tab)?.action;
      if (!action) return;
      const app = document.getElementById('app');
      app.innerHTML = `<div class="loading">Loading ${TAB_DEFS.find(t=>t.id===tab).label}…</div>`;
      const r = await fetch(`/api/list/${action}`);
      if (!r.ok) { app.innerHTML = '<div class="empty">Error loading.</div>'; return; }
      const data = await r.json();
      if (!data.books || data.books.length === 0) {
        app.innerHTML = `<div class="empty">No ${TAB_DEFS.find(t=>t.id===tab).label.toLowerCase()} yet.</div>`;
        return;
      }
      currentBooks = data.books;
      renderTable(data.books, false);
    }

    function renderTable(books, showActions) {
      const app = document.getElementById('app');
      const actions = showActions ? `
        <td class="actions">
          <button class="dislike" onclick="send(${0},'dislike')">👎</button>
          <button class="skip" onclick="send(${0},'skip')">Skip</button>
          <button class="toread" onclick="send(${0},'toread')">📚 To Read</button>
          <button class="more" onclick="moreLike(${0})">More</button>
          <button class="like" onclick="send(${0},'like')">👍</button>
        </td>` : '<td class="actions"></td>';
      const rows = books.map(b => {
        const cover = b.cover_url
          ? `<img class="cover" src="${b.cover_url}" alt="cover">`
          : '<div class="no-cover">📖</div>';
        const acts = showActions ? `
          <td class="actions">
            <button class="dislike" onclick="send(${b.id},'dislike')">👎</button>
            <button class="skip" onclick="send(${b.id},'skip')">Skip</button>
            <button class="toread" onclick="send(${b.id},'toread')">📚 To Read</button>
            <button class="more" onclick="moreLike(${b.id})">More</button>
            <button class="like" onclick="send(${b.id},'like')">👍</button>
          </td>` : '<td class="actions"></td>';
        return `
          <tr data-id="${b.id}">
            <td class="cover-cell">${cover}</td>
            <td>
              <div class="title">${escapeHtml(b.title)}</div>
              <div class="authors">${escapeHtml((b.authors||[]).join(', ') || 'Unknown author')}</div>
            </td>
            <td class="reason">${escapeHtml(b.reason || b.why || '')}</td>
            <td class="desc">${escapeHtml(b.description || '')}</td>
            ${acts}
          </tr>`;
      }).join('');
      const headers = showActions
        ? '<tr><th></th><th>Book</th><th>Why</th><th>About</th><th>Actions</th></tr>'
        : '<tr><th></th><th>Book</th><th>Why</th><th>About</th><th></th></tr>';
      app.innerHTML = `<table><thead>${headers}</thead><tbody>${rows}</tbody></table>`;
    }

    async function moreLike(bookId) {
      currentTab = 'more';
      renderTabs();
      renderToolbar();
      const app = document.getElementById('app');
      app.innerHTML = '<div class="loading">Finding similar books…</div>';
      const r = await fetch(`/api/more-like/${bookId}?count=10`);
      if (!r.ok) { app.innerHTML = '<div class="empty">Book not found.</div>'; return; }
      const data = await r.json();
      if (data.done || !data.books || data.books.length === 0) {
        app.innerHTML = '<div class="empty">No similar books found.<br><button onclick="switchTab(\'recommend\')">Back to recommendations</button></div>';
        return;
      }
      currentBooks = data.books;
      renderTable(data.books, false);
    }

    async function send(bookId, action) {
      const book = currentBooks.find(b => b.id === bookId);
      if (!book) return;
      const row = document.querySelector(`tr[data-id="${bookId}"]`);
      if (row) row.remove();
      await fetch('/api/feedback', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({book_id: bookId, action, reason_shown: book.reason || book.why || ''}) });
      loadStats();
    }

    async function resetSeen() {
      if (!confirm('Clear your seen history? All books will become eligible again.')) return;
      await fetch('/api/reset-seen', { method:'POST' });
      loadStats();
      if (currentTab === 'recommend') loadRecommendations();
    }

    async function loadStats() {
      const r = await fetch('/api/stats');
      statsData = await r.json();
      document.getElementById('stats').textContent = `${statsData.total} books · ${statsData.liked} liked · ${statsData.disliked} disliked · ${statsData.toread} to read · ${statsData.seen} seen`;
      renderTabs();
    }

    function escapeHtml(t) { return (t||'').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }

    loadStats();
    loadRecommendations();
  </script>
</body>
</html>
