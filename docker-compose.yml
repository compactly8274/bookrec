services:
  bookrec:
    image: ghcr.io/compactly8274/bookrec:latest
    container_name: bookrec
    restart: unless-stopped
    ports:
      - "8484:8000"
    environment:
      # Ollama endpoint for LLM-generated reasons. Leave empty to disable LLM.
      OLLAMA_URL: ""
      OLLAMA_MODEL: "gemma3:4b"
    volumes:
      - /mnt/user/Books:/calibre:ro
      - /mnt/user/appdata/bookrec:/config
    deploy:
      resources:
        limits:
          memory: 1.5G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/stats',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First boot downloads the embedding model (~90 MB) and indexes the whole
      # library, which can take several minutes on a large collection.
      start_period: 10m
